<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Listas — IPTV Lists</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;600;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#090c10;--surface:#0f1318;--border:#1e2530;--accent:#00e5ff;--text:#c8d6e5;--dim:#4a5568;--mono:'Share Tech Mono',monospace;--sans:'Barlow',sans-serif}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
    .wrapper{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:48px 24px 80px}
    .breadcrumb{font-family:var(--mono);font-size:12px;color:var(--dim);margin-bottom:40px}
    .breadcrumb a{color:var(--accent);text-decoration:none}
    h1{font-size:48px;font-weight:800;color:#fff;letter-spacing:-0.03em;margin-bottom:32px}
    .cat-row{display:grid;grid-template-columns:36px 100px 1fr 100px 24px;gap:16px;align-items:center;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:3px;text-decoration:none;color:inherit;margin-bottom:4px;transition:border-color .2s}
    .cat-row:hover{border-color:var(--accent)}
    .cat-icon{font-size:22px}
    .cat-name{font-size:18px;font-weight:800;color:#fff}
    .cat-desc{font-size:13px;color:var(--dim)}
    .cat-count{font-family:var(--mono);font-size:12px;color:var(--accent);text-align:right}
    .back-link{display:inline-flex;align-items:center;gap:8px;margin-top:40px;font-family:var(--mono);font-size:12px;color:var(--dim);text-decoration:none}
    .back-link:hover{color:var(--accent)}
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="breadcrumb"><a href="/">inicio</a> / listas</div>
    <h1>Listas</h1>
    
    <a class="cat-row" href="/listas/tv/">
      <span class="cat-icon">📡</span>
      <span class="cat-name">TV</span>
      <span class="cat-desc">Canales en vivo</span>
      <span class="cat-count">0 archivos</span>
      <span>↗</span>
    </a>
    <a class="cat-row" href="/listas/series/">
      <span class="cat-icon">🎬</span>
      <span class="cat-name">Series</span>
      <span class="cat-desc">Episodios y temporadas</span>
      <span class="cat-count">0 archivos</span>
      <span>↗</span>
    </a>
    <a class="cat-row" href="/listas/movies/">
      <span class="cat-icon">🎞️</span>
      <span class="cat-name">Movies</span>
      <span class="cat-desc">Películas bajo demanda</span>
      <span class="cat-count">0 archivos</span>
      <span>↗</span>
    </a>
    <a class="back-link" href="/">← volver al inicio</a>
  </div>
</body>
</html>
