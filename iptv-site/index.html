<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV Lists</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #090c10;
      --surface: #0f1318;
      --border: #1e2530;
      --accent: #00e5ff;
      --accent2: #ff3d6b;
      --text: #c8d6e5;
      --dim: #4a5568;
      --mono: 'Share Tech Mono', monospace;
      --sans: 'Barlow', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow blob */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(0,229,255,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px 80px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 64px;
    }

    .signal {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 0.6s 0.1s forwards;
    }

    .signal::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: clamp(42px, 8vw, 80px);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.03em;
      color: #fff;
      opacity: 0;
      animation: fadeUp 0.6s 0.2s forwards;
    }

    h1 span {
      color: var(--accent);
      text-shadow: 0 0 40px rgba(0,229,255,0.4);
    }

    .subtitle {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 300;
      color: var(--dim);
      letter-spacing: 0.05em;
      font-family: var(--mono);
      opacity: 0;
      animation: fadeUp 0.6s 0.3s forwards;
    }

    /* Cards grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 960px;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 36px 32px;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: border-color 0.25s, transform 0.25s;
      opacity: 0;
      animation: fadeUp 0.5s forwards;
    }

    .card:nth-child(1) { animation-delay: 0.4s; }
    .card:nth-child(2) { animation-delay: 0.5s; }
    .card:nth-child(3) { animation-delay: 0.6s; }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,229,255,0.05) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
    }

    .card:hover::before { opacity: 1; }

    /* Accent line top */
    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s;
    }

    .card:hover::after { transform: scaleX(1); }

    .card-icon {
      font-size: 32px;
      margin-bottom: 20px;
      display: block;
      filter: grayscale(0.3);
      transition: filter 0.3s;
    }

    .card:hover .card-icon { filter: grayscale(0); }

    .card-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .card-desc {
      margin-top: 12px;
      font-size: 13px;
      color: var(--dim);
      font-weight: 300;
    }

    .card-arrow {
      position: absolute;
      bottom: 28px;
      right: 28px;
      font-size: 20px;
      color: var(--dim);
      transition: color 0.25s, transform 0.25s;
    }

    .card:hover .card-arrow {
      color: var(--accent);
      transform: translate(3px, -3px);
    }

    /* Footer */
    footer {
      margin-top: 80px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.1em;
      text-align: center;
    }

    footer a {
      color: var(--dim);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover { color: var(--accent); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="signal">Señal activa</div>
      <h1>IPTV<br/><span>Lists</span></h1>
      <p class="subtitle">// selecciona una categoría para explorar</p>
    </header>

    <div class="grid">
      <a class="card" href="/listas/tv/">
        <span class="card-icon">📡</span>
        <div class="card-label">Categoría</div>
        <div class="card-title">TV</div>
        <div class="card-desc">Canales en vivo y transmisiones en tiempo real</div>
        <span class="card-arrow">↗</span>
      </a>

      <a class="card" href="/listas/series/">
        <span class="card-icon">🎬</span>
        <div class="card-label">Categoría</div>
        <div class="card-title">Series</div>
        <div class="card-desc">Listas de episodios y temporadas completas</div>
        <span class="card-arrow">↗</span>
      </a>

      <a class="card" href="/listas/movies/">
        <span class="card-icon">🎞️</span>
        <div class="card-label">Categoría</div>
        <div class="card-title">Movies</div>
        <div class="card-desc">Películas y contenido bajo demanda</div>
        <span class="card-arrow">↗</span>
      </a>
    </div>

    <footer>
      <p>IPTV Lists — desplegado en Netlify</p>
    </footer>
  </div>
</body>
</html>
